<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relationship Chart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="topbar">
    <span class="topbar-label">USER</span>
    <div class="select-wrapper">
      <select id="userSelect">
        <option value="all">all</option>
        <option value="oxygen_ptg">oxygen_ptg</option>
        <option value="exstro_ed">exstro_ed</option>
        <option value="ilyaper4ic">ilyaper4ic</option>
        <option value="_vermor_">_vermor_</option>
        <option value="neon">neon</option>
        <option value="bucha_808">bucha_808</option>
        <option value="bakdajan">bakdajan</option>
        <option value="kutkut">kutkut</option>
        <option value="levi">levi</option>
        <option value="angel">angel</option>
        <option value="defanel">defanel</option>
        <option value="mullinix">mullinix</option>
        <option value="david">david</option>
        <option value="mramorsv">mramorsv</option>
        <option value="shaman_mahan">shaman_mahan</option>
        <option value="litvinator">litvinator</option>
      </select>
      <span class="select-arrow">▾</span>
    </div>

    <div class="toggle-wrapper">
      <span class="toggle-label" id="modeLabel">FROM</span>
      <label class="toggle">
        <input type="checkbox" id="modeSwitch" />
        <span class="slider"></span>
      </label>
      <span class="toggle-label" id="modeLabelTo">TO</span>
    </div>
  </div>

  <div class="content">
    <div class="main-view">
      <img id="tableImage" src="images/oxygen_ptg_from.png" alt="Relationship chart" />
    </div>

    <div class="legend-view">
      <h3>Legend</h3>
      <ul class="legend-list">
        <li><span class="dot" style="background:#FE024F"></span> Couple</li>
        <li><span class="dot" style="background:#FE8BD8"></span> In Love</li>
        <li><span class="dot" style="background:#C401FD"></span> Best Friends</li>
        <li><span class="dot" style="background:#02B7FC"></span> Friends</li>
        <li><span class="dot" style="background:#02B7FC"></span> Respect</li>
        <li><span class="dot" style="background:#FEDE00"></span> OK</li>
        <li><span class="dot" style="background:#740168"></span> Heard of</li>
        <li><span class="dot" style="background:#02DA6B"></span> Never Met</li>
        <li><span class="dot" style="background:#FD5401"></span> Dislikes</li>
        <li><span class="dot" style="background:#BE0000"></span> Hate</li>
        <li><span class="dot" style="background:#FFFFFF; border:1px solid #666"></span> Mystery</li>
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
